<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Face Analysis Dashboard</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; margin: 30px; }
    h1 { text-align: center; }
    .stats {
      text-align: center; 
      margin-bottom: 20px;
      font-size: 16px;
    }
    .filter {
      text-align: center; margin-bottom: 20px;
    }
    select {
      font-size: 14px; padding: 5px 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 10px; text-align: center;
    }
    .card img {
      width: 100%; border-radius: 8px; object-fit: cover; max-height: 180px;
    }
    .info { margin-top: 8px; font-size: 14px; }
    .male { color: #007bff; }
    .female { color: #d63384; }
  </style>
</head>
<body>
  <h1>Face Analysis Dashboard</h1>

  <!-- Bộ lọc -->
  <div class="filter">
    <form method="get" action="/">
      <label for="gender">Lọc theo giới tính:</label>
      <select name="gender" id="gender" onchange="this.form.submit()">
        <option value="All" {% if selected_gender=='All' %}selected{% endif %}>Tất cả</option>
        <option value="Man" {% if selected_gender=='Man' %}selected{% endif %}>Nam</option>
        <option value="Woman" {% if selected_gender=='Woman' %}selected{% endif %}>Nữ</option>
      </select>
    </form>
  </div>

  <!-- Thống kê -->
  <div class="stats">
    <strong>Tổng số khuôn mặt:</strong> {{ total_faces }}<br>
    {% for g, p in gender_percent.items() %}
      {{ g }}: {{ p }}%{% if not loop.last %} | {% endif %}
    {% endfor %}
  </div>

  <!-- Hiển thị ảnh -->
  <div class="grid">
    {% for face in faces %}
      <div class="card">
        <img src="{{ face.ImagePath }}" alt="Face">
        <div class="info">
          <strong>{{ face.Filename }}</strong><br>
          Age: {{ face.Age }}<br>
          Gender:
          <span class="{{ 'male' if face.Gender=='Man' else 'female' }}">
            {{ face.Gender }}
          </span>
        </div>
      </div>
    {% endfor %}
  </div>
</body>
</html>
